name: Verificar API e isolamento
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tenantflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: owner-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tenantflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes rápidos
        run: pytest -q
      - name: Preparar PostgreSQL de testes
        env:
          PGPASSWORD: owner-test-only
        run: psql -h localhost -U postgres -d tenantflow_test -v ON_ERROR_STOP=1 -f database/001_initial.sql
      - name: Verificar RLS e concorrência
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tenantflow:local-demo-only@localhost:5432/tenantflow_test
        run: pytest -q
